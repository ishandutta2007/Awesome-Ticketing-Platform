<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#ec4899;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#3b82f6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Line Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #94a3b8;
        letter-spacing: 1.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .ticket-border {
        stroke-dasharray: 6,4;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Glowing Ambient Lights -->
  <circle cx="150" cy="60" r="140" fill="url(#orb1)">
    <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="60;140;60" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="180" r="150" fill="url(#orb2)">
    <animate attributeName="cx" values="780;700;780" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="180;100;180" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="200" r="120" fill="url(#orb3)">
    <animate attributeName="r" values="120;160;120" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Background Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
  </g>

  <!-- Dynamic Floating Ticket Icon Left -->
  <g transform="translate(60, 65)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5; 5; -5" dur="6s" repeatCount="indefinite" />
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 80 0 C 85.5 0 90 4.5 90 10 L 90 35 C 82 35 82 55 90 55 L 90 80 C 90 85.5 85.5 90 80 90 L 10 90 C 4.5 90 0 85.5 0 80 L 0 55 C 8 55 8 35 0 35 Z" 
            fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" />
      <line x1="62" y1="0" x2="62" y2="90" stroke="#6366f1" stroke-width="1.5" class="ticket-border" />
      <circle cx="31" cy="45" r="14" fill="#312e81" stroke="#818cf8" stroke-width="1" />
      <path d="M 31 36 L 33.5 41.5 L 39.5 42 L 35 46 L 36.5 52 L 31 49 L 25.5 52 L 27 46 L 22.5 42 L 28.5 41.5 Z" fill="#38bdf8">
        <animateTransform attributeName="transform" type="rotate" from="0 31 45" to="360 31 45" dur="15s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <!-- Dynamic Floating Ticket Icon Right -->
  <g transform="translate(760, 65)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6; -4; 6" dur="7s" repeatCount="indefinite" />
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 80 0 C 85.5 0 90 4.5 90 10 L 90 35 C 82 35 82 55 90 55 L 90 80 C 90 85.5 85.5 90 80 90 L 10 90 C 4.5 90 0 85.5 0 80 L 0 55 C 8 55 8 35 0 35 Z" 
            fill="#31103f" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" />
      <line x1="28" y1="0" x2="28" y2="90" stroke="#ec4899" stroke-width="1.5" class="ticket-border" />
      <g stroke="#f472b6" stroke-width="2">
        <line x1="42" y1="25" x2="42" y2="65" />
        <line x1="48" y1="25" x2="48" y2="65" stroke-width="1" />
        <line x1="54" y1="25" x2="54" y2="65" stroke-width="3" />
        <line x1="62" y1="25" x2="62" y2="65" stroke-width="1.5" />
        <line x1="70" y1="25" x2="70" y2="65" stroke-width="2.5" />
      </g>
    </g>
  </g>

  <!-- Top Category Pill Badge -->
  <g transform="translate(330, 28)">
    <rect width="240" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="15" cy="13" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="127" y="17" text-anchor="middle" fill="#38bdf8" class="badge-text">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" fill="url(#accentGrad)" class="title" filter="url(#glow)">
    AWESOME TICKETING PLATFORM
  </text>

  <!-- Subtitle -->
  <text x="450" y="140" text-anchor="middle" class="subtitle">
    SaaS &amp; OPEN-SOURCE EVENT TICKETING • BOX OFFICE • REGISTRATION
  </text>

  <!-- Bottom Interactive Tags / Pills -->
  <g transform="translate(195, 172)">
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <text x="75" y="18" text-anchor="middle" fill="#c7d2fe" class="badge-text">⚡ OPEN-SOURCE</text>
    </g>
    <g transform="translate(170, 0)">
      <rect width="165" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
      <text x="82" y="18" text-anchor="middle" fill="#fbcfe8" class="badge-text">💎 ENTERPRISE SAAS</text>
    </g>
    <g transform="translate(355, 0)">
      <rect width="155" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <text x="77" y="18" text-anchor="middle" fill="#bae6fd" class="badge-text">🎟️ QR SCAN &amp; POS</text>
    </g>
  </g>

  <!-- Bottom Animated Glowing Border -->
  <line x1="50" y1="239" x2="850" y2="239" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </line>
</svg>